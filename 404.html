<!DOCTYPE html>
<html lang="zh-Hant-TW" data-lang="zh">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Page Not Found | Jin Chang 晉昌國際</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏛️</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div class="bg-grid-overlay"></div>

  <header id="main-header" class="site-header header-scrolled">
    <div class="container header-container">
      <a href="index.html" class="logo">
        <div class="logo-badge">
          <img src="assets/logo.png" class="logo-image" alt="Jin Chang Logo">
        </div>
        <span class="logo-text">JIN CHANG</span>
      </a>
    </div>
  </header>

  <main style="display: flex; align-items: center; justify-content: center; min-height: 80vh; padding-top: 100px;">
    <div class="container" style="text-align: center;">
      <h1 style="font-size: 5rem; color: var(--accent-red); margin-bottom: 20px; font-weight: 700;">404</h1>
      <h2 style="font-size: 1.8rem; margin-bottom: 15px; color: var(--heading-color);">
        <span class="lang-zh">頁面不存在或已移轉</span>
        <span class="lang-en">Page Not Found</span>
      </h2>
      <p style="color: var(--text-muted); max-width: 500px; margin: 0 auto 30px auto; line-height: 1.6;">
        <span class="lang-zh">您所存取的頁面可能已被移轉、更名或暫時無法存取。請傳送至晉昌國際官方首頁。</span>
        <span class="lang-en">The page you requested may have been relocated or is temporarily unavailable. Please return to the official home page.</span>
      </p>
      <a href="index.html" class="btn btn-primary btn-large">
        <span class="lang-zh">返回機構首頁</span>
        <span class="lang-en">Return to Home</span>
      </a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-container">
      <p class="footer-copy">&copy; 2026 Jin Chang Development Group. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="js/main.js" defer></script>
</body>

</html>
